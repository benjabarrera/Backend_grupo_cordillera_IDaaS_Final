# EP5 - IdP local de PRUEBAS (no sustituye Entra ID ni desactiva JWT).
# Debe combinarse al final con los otros cuatro archivos Compose de api-gateway.
services:
  keycloak-ep5:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Configura KEYCLOAK_ADMIN_USERNAME en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Configura KEYCLOAK_ADMIN_PASSWORD en .env}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak-lab/cordillera-lab-realm.json:/opt/keycloak/data/import/cordillera-lab-realm.json:ro
      - ep5-keycloak-data:/opt/keycloak/data
    networks:
      - cordillera-net

  api-gateway:
    environment:
      # EL MODO ORIGINAL MICROSOFT ENTRA SE CONSERVA EN EL COMPOSE ORIGINAL.
      # Este archivo se usa SOLO para activar la identidad local de pruebas.
      AZURE_ISSUER: http://localhost:8180/realms/cordillera-lab
      AZURE_JWK_SET_URI: http://keycloak-ep5:8080/realms/cordillera-lab/protocol/openid-connect/certs
      AZURE_AUDIENCE: cordillera-api
      AZURE_API_SCOPE: access_as_user
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak-ep5:8080/realms/cordillera-lab/protocol/openid-connect/certs
    depends_on:
      - keycloak-ep5

volumes:
  ep5-keycloak-data:
