spring.application.name=ventas
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bd_ventas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Resilience4j
resilience4j.circuitbreaker.instances.finanzas.sliding-window-size=10
resilience4j.circuitbreaker.instances.finanzas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.finanzas.wait-duration-in-open-state=5s

# Reintento de sincronizacion con finanzas
finanzas.reintento.delay-ms=60000

# Kafka EP5 - productor de eventos de ventas
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.batch-size=32768
spring.kafka.producer.compression-type=snappy
spring.kafka.producer.properties[spring.json.add.type.headers]=false

# EP5 RabbitMQ: valores inyectados por Docker al ejecutar contenedores
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:cordillera}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
